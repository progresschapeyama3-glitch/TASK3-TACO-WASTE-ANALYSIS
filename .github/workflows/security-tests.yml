name: Security and Automated Tests

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  security-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest bandit pip-audit

      - name: SCA - Dependency Security Scan
        run: |
          pip-audit

      - name: SAST - Static Code Security Scan
        run: |
          bandit -r src main.py

      - name: Automated Tests
        run: |
          pytest -q